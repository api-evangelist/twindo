aid: twindo
name: Twindo
description: >-
  Twindo (formerly Canvas, by Occipital Inc.) is a spatial intelligence platform
  that turns LiDAR scans captured with an iPhone or iPad into 99%-accurate,
  editable CAD and BIM as-built models compatible with Revit, AutoCAD, Archicad,
  Chief Architect, SketchUp, Vectorworks, and 2020 Design. The platform spans
  Scan to CAD, Plan to CAD, Point Cloud to BIM, a browser Web Viewer, and an
  enterprise SDK + API for integrating reality capture and structured spatial
  data into custom workflows. Twindo publishes a machine-readable "LLM JSON API"
  company profile for LLMs and agents.
